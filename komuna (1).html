<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קומונה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=Suez+One&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --solid: #f7f9f4; --ink: #1b2a24; --ink-2: #4d5d55; --panel: rgba(248, 250, 245, .95); --panel-2: #e9efe5;
  --line: rgba(27, 42, 36, .16); --accent: #1d7a5b; --accent-ink: #ffffff; --danger: #c1412d; --gold: #b8871c;
  --shadow: 0 8px 28px rgba(8, 30, 24, .28);
  --f-display: "Suez One", Georgia, "Times New Roman", serif;
  --f-body: "Assistant", "Segoe UI", system-ui, -apple-system, sans-serif;
  --c-avo: #4f8a2b; --c-stone: #9a9a92; --c-metal: #5f7f99; --c-horse: #a9713a; --c-hay: #d9a93a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --solid: #15201c; --ink: #e9f0ea; --ink-2: #a7b7ad; --panel: rgba(21, 32, 28, .94); --panel-2: #24352f;
    --line: rgba(233, 240, 234, .16); --accent: #5ccb9d; --accent-ink: #0b1e17; --danger: #ff7a63; --gold: #e6b84a;
    --shadow: 0 8px 28px rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  --solid: #15201c; --ink: #e9f0ea; --ink-2: #a7b7ad; --panel: rgba(21, 32, 28, .94); --panel-2: #24352f;
  --line: rgba(233, 240, 234, .16); --accent: #5ccb9d; --accent-ink: #0b1e17; --danger: #ff7a63; --gold: #e6b84a;
  --shadow: 0 8px 28px rgba(0, 0, 0, .55);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: #9fd0e0; color: var(--ink); font-family: var(--f-body); font-size: 15px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#top {
  position: absolute; top: 0; left: 0; right: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px 0;
}
#players { display: flex; gap: 6px; overflow-x: auto; pointer-events: auto; scrollbar-width: none; padding-bottom: 2px; }
#players::-webkit-scrollbar { display: none; }
.pcard {
  flex: 1 1 0; min-width: 96px; background: linear-gradient(165deg, color-mix(in srgb, var(--panel) 92%, white 8%), var(--panel));
  border-radius: 12px; padding: 5px 9px 6px; border: 1.5px solid color-mix(in srgb, var(--pc) 55%, var(--line));
  border-inline-start: 6px solid var(--pc);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -8px 14px -10px color-mix(in srgb, var(--pc) 35%, transparent);
  position: relative; transition: box-shadow .2s, outline-color .2s;
}
.pcard.turn { outline: 2.5px solid var(--pc); outline-offset: 1px; box-shadow: var(--shadow), 0 0 0 5px color-mix(in srgb, var(--pc) 22%, transparent), inset 0 1px 0 rgba(255,255,255,.4); }
.pcard .nm { font-weight: 800; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 96px; }
.pcard .vp { font-family: var(--f-display); font-size: 25px; line-height: 1; margin-top: 1px; }
.pcard .vp small { font-family: var(--f-body); font-size: 11px; color: var(--ink-2); font-weight: 600; margin-inline-start: 3px; }
.pcard .st { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; margin-top: 2px; letter-spacing: -.1px; }
.badge { display: inline-block; background: var(--gold); color: #fff; border-radius: 6px; font-size: 10px; font-weight: 800; padding: 0 4px; margin-inline-start: 2px; }
#statusbar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
#status {
  flex: 1; pointer-events: auto; background: var(--panel); border-radius: 12px; padding: 8px 12px;
  font-weight: 700; font-size: 14px; box-shadow: var(--shadow); min-height: 38px; display: flex; align-items: center;
}
#dice { display: flex; gap: 5px; pointer-events: auto; }
.die { width: 38px; height: 38px; background: #fbf7ea; border-radius: 9px; box-shadow: var(--shadow), inset 0 -3px 0 rgba(0,0,0,.12); transition: transform .5s cubic-bezier(.34,1.56,.64,1); will-change: transform; }
@media (prefers-reduced-motion: reduce) { .die { transition: none; } }
#ticker {
  margin-top: 6px; pointer-events: auto; font-size: 12.5px; color: #10231c; background: rgba(255,255,255,.72);
  border-radius: 9px; padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
#fabs { display: flex; gap: 8px; margin-top: 6px; pointer-events: auto; }
.fab {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
  background: linear-gradient(155deg, color-mix(in srgb, var(--panel) 90%, white 10%), var(--panel));
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.5); font-size: 19px; display: grid; place-items: center;
  transition: transform .15s, box-shadow .15s;
}
.fab:active { transform: scale(.94); }
.fab.on { background: linear-gradient(155deg, color-mix(in srgb, var(--accent) 85%, white 15%), var(--accent)); color: var(--accent-ink); }

#bottom {
  position: absolute; left: 0; right: 0; bottom: 0; pointer-events: auto;
  padding: 10px 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 94%, white 6%), var(--panel));
  border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(8, 30, 24, .28), inset 0 1.5px 0 rgba(255,255,255,.5);
  border-top: 1px solid color-mix(in srgb, var(--accent) 18%, var(--line));
}
#hand { display: flex; gap: 6px; }
.chip {
  flex: 1 1 0; min-width: 0; background: linear-gradient(165deg, color-mix(in srgb, var(--panel-2) 90%, white 10%), var(--panel-2));
  border-radius: 11px; padding: 4px 2px 3px; text-align: center;
  border-bottom: 3.5px solid var(--rc, var(--line)); position: relative; border-top: 0; border-inline: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 5px rgba(8,30,24,.12);
}
.chip .ic { font-size: 19px; line-height: 1.1; display: block; }
.chip .n { font-family: var(--f-display); font-size: 21px; line-height: 1; display: block; }
.chip .rt { position: absolute; top: 1px; left: 3px; font-size: 9.5px; font-weight: 800; color: var(--accent); }
.chip.dev { --rc: var(--gold); }
.chip.dev.dot::after { content: ""; position: absolute; top: 3px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
#actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#hint { width: 100%; font-size: 13px; color: var(--ink-2); font-weight: 600; padding: 2px 2px 0; }
.btn {
  flex: 1 1 calc(33% - 6px); min-width: 0; min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line);
  background: linear-gradient(165deg, color-mix(in srgb, var(--panel-2) 92%, white 8%), var(--panel-2));
  font-weight: 800; font-size: 14px; padding: 4px 8px; line-height: 1.15;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 5px rgba(8,30,24,.14);
  transition: transform .12s, box-shadow .12s;
}
.btn small { font-size: 11px; font-weight: 600; color: var(--ink-2); letter-spacing: 1px; }
.btn.pri {
  background: linear-gradient(165deg, color-mix(in srgb, var(--accent) 80%, white 20%), var(--accent));
  color: var(--accent-ink); border-color: transparent;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 3px 10px color-mix(in srgb, var(--accent) 45%, transparent);
}
.btn.pri small { color: inherit; opacity: .85; }
.btn.warn { background: linear-gradient(165deg, color-mix(in srgb, var(--danger) 80%, white 20%), var(--danger)); color: #fff; border-color: transparent; }
.btn.dim, .btn:disabled { opacity: .45; box-shadow: none; }
.btn.armed { outline: 3px solid var(--gold); outline-offset: 1px; }
.btn:active { transform: translateY(1.5px) scale(.985); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 1px 2px rgba(8,30,24,.14); }
.btn:focus-visible, .fab:focus-visible, .chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.wide { flex-basis: 100%; }

#toast {
  z-index: 60; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(170px + env(safe-area-inset-bottom, 0px));
  background: rgba(20, 30, 26, .93); color: #fff; padding: 9px 15px; border-radius: 12px; font-weight: 700; font-size: 14px;
  max-width: 88vw; text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s;
}
#toast.show { opacity: 1; }

/* ---------- Sheets ---------- */
#sheetWrap { position: fixed; inset: 0; background: rgba(6, 20, 16, 0); display: flex; align-items: flex-end; z-index: 35; transition: background .28s ease; }
#sheetWrap.show { background: rgba(6, 20, 16, .45); }
#sheetWrap #sheet { transform: translateY(100%); transition: transform .32s cubic-bezier(.22,1,.36,1); }
#sheetWrap.show #sheet { transform: translateY(0); }
@media (prefers-reduced-motion: reduce) { #sheetWrap, #sheetWrap #sheet { transition: none; } }
#sheet {
  width: 100%; max-height: 82%; overflow-y: auto; background: var(--solid); border-radius: 22px 22px 0 0; padding: 16px 14px calc(env(safe-area-inset-bottom, 0px) + 16px);
  box-shadow: var(--shadow); -webkit-overflow-scrolling: touch;
}
#sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 23px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
#sheet h3 { font-size: 14px; margin: 14px 0 6px; color: var(--ink-2); }
#sheet .x { border: 0; background: var(--panel-2); width: 34px; height: 34px; border-radius: 50%; font-size: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.rlist { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rbtn { border: 2px solid transparent; background: var(--panel-2); border-radius: 12px; padding: 7px 2px; text-align: center; border-bottom: 4px solid var(--rc); }
.rbtn .ic { font-size: 22px; display: block; }
.rbtn .n { font-family: var(--f-display); font-size: 17px; display: block; }
.rbtn small { font-size: 10.5px; color: var(--ink-2); font-weight: 700; display: block; }
.rbtn.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); }
.rbtn:disabled { opacity: .35; }
.stepper { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.stp { background: var(--panel-2); border-radius: 12px; padding: 5px 2px; text-align: center; border-bottom: 4px solid var(--rc); }
.stp .ic { font-size: 19px; }
.stp .v { font-family: var(--f-display); font-size: 21px; display: block; line-height: 1.1; }
.stp .pm { display: flex; }
.stp .pm button { flex: 1; border: 0; background: transparent; font-size: 22px; font-weight: 800; height: 36px; color: var(--accent); }
.stp .pm button:disabled { opacity: .25; }
.tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tab { flex: 1; min-height: 40px; border-radius: 10px; border: 0; background: var(--panel-2); font-weight: 800; }
.tab.sel { background: var(--accent); color: var(--accent-ink); }
.dev-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.dev-item .t { flex: 1; }
.dev-item .t b { display: block; }
.dev-item .t span { font-size: 12.5px; color: var(--ink-2); }
.log-line { padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.cost-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-weight: 700; }
.cost-row span:last-child { letter-spacing: 2px; }
.note { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
textarea, input[type=text] {
  width: 100%; font: inherit; color: var(--ink); background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; user-select: text; -webkit-user-select: text;
}
textarea { min-height: 96px; resize: none; direction: ltr; font-size: 12px; }

/* ---------- Lobby / overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 18px;
  background: radial-gradient(120% 90% at 50% 0%, #3aa0bf 0%, #1f6f93 55%, #164a66 100%); overflow-y: auto;
}
.overlay.soft { background: rgba(9, 24, 19, .82); }
.lobby { width: 100%; max-width: 420px; color: #f6f8f2; }
.lobby h1 { font-family: var(--f-display); font-weight: 400; font-size: 52px; margin: 6px 0 0; letter-spacing: .5px; }
.lobby p.sub { margin: 4px 0 16px; font-size: 16px; opacity: .92; line-height: 1.4; }
.lobby .logo { width: 150px; height: auto; display: block; }
.card { background: var(--panel); color: var(--ink); border-radius: 18px; padding: 14px; margin-top: 10px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 8px; font-size: 16px; }
.seg { display: flex; gap: 6px; margin: 6px 0 10px; }
.seg button { flex: 1; min-height: 42px; border-radius: 10px; border: 2px solid transparent; background: var(--panel-2); font-weight: 800; }
.seg button.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); }
.field { margin: 6px 0; display: flex; align-items: center; gap: 8px; }
.field i { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid rgba(0,0,0,.18); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; margin: 8px 0; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
#curtain { z-index: 45; }
#curtain h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0 0 6px; }
#curtain { text-align: center; color: #fff; flex-direction: column; }
.win { text-align: center; }
.win .trophy { font-size: 64px; }
.win h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 4px 0; }
.scoreline { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-weight: 700; }
.err { color: var(--danger); font-weight: 700; font-size: 13.5px; }
@media (min-width: 720px) {
  #bottom { left: 50%; right: auto; transform: translateX(-50%); width: 640px; border-radius: 20px 20px 0 0; }
  #sheet { max-width: 560px; margin: 0 auto; border-radius: 22px; margin-bottom: 20px; }
  #players { justify-content: center; }
  .pcard { max-width: 170px; }
}

#errbar { position: fixed; top: 0; left: 0; right: 0; z-index: 90; background: #b3261e; color: #fff; font: 11px/1.3 monospace; direction: ltr; padding: 3px 6px; pointer-events: none; }

/* ---------- אייקונים ---------- */
svg.ic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
.bl { display: inline-flex; align-items: center; gap: 6px; }
.btn small { display: inline-flex; align-items: center; gap: 1px; letter-spacing: 0; }
.btn small .ic { width: 14px; height: 14px; vertical-align: 0; }
.chip .ic { display: block; width: 25px; height: 25px; margin: 0 auto 2px; font-size: inherit; line-height: 1; }
.chip.dev { color: var(--gold); }
.chip.dev .n { color: var(--ink); }
.rbtn .ic { display: block; width: 28px; height: 28px; margin: 0 auto 2px; }
.stp .ic { display: block; width: 26px; height: 26px; margin: 0 auto; }
.pcard .st { display: flex; align-items: center; gap: 2px; }
.pcard .st .ic { width: 13px; height: 13px; vertical-align: 0; margin-inline-start: 6px; }
.pcard .st .ic:first-child { margin-inline-start: 0; }
.badge { display: inline-flex; align-items: center; gap: 1px; vertical-align: 3px; }
.badge .ic { width: 10px; height: 10px; vertical-align: 0; }
.sic { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); margin-inline-end: 9px; flex: none; }
.sic .ic { width: 17px; height: 17px; vertical-align: 0; }
#status { line-height: 1.25; }
.devic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--panel-2); color: var(--accent); flex: none; }
.devic .ic { width: 24px; height: 24px; vertical-align: 0; }
.cost-row span:first-child { display: inline-flex; align-items: center; gap: 8px; }
.cost-row span:last-child { display: inline-flex; gap: 3px; letter-spacing: 0; }
.cost-row span:last-child .ic { width: 22px; height: 22px; vertical-align: 0; }
.win .trophy { color: var(--gold); }
.win .trophy .ic { width: 64px; height: 64px; }
.fab .ic { width: 22px; height: 22px; vertical-align: 0; }
#toast .ic { width: 18px; height: 18px; vertical-align: -4px; margin: 0 2px; }
.rbtn small, .stp small { display: block; }

/* ---------- צ'אט ---------- */
#chatBody { max-height: 44vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px 0; }
.chat-msg { background: var(--panel-2); border-radius: 12px; padding: 7px 10px; max-width: 86%; align-self: flex-start; }
.chat-msg.me { align-self: flex-end; background: color-mix(in srgb, var(--accent) 22%, var(--panel-2)); }
.chat-msg b { display: block; font-size: 11.5px; margin-bottom: 1px; }
.chat-msg span { font-size: 14.5px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
#chatIn { flex: 1; }

/* ---------- כרטיס הקדשה ---------- */
.card.ded { background: linear-gradient(165deg, #fff6e0, #ffe9c2); border: 1.5px solid #e7c478; }
.card.ded h3 { color: #7a5416; font-family: "Frank Ruhl Libre", var(--f-display); font-weight: 900; font-size: 19px; }
.card.ded .x { border: 0; background: rgba(0,0,0,.08); width: 30px; height: 30px; border-radius: 50%; font-size: 14px; flex: none; color: #5c4418; }
.ded-msg {
  margin-top: 8px; font-family: "Frank Ruhl Libre", serif; font-weight: 700; font-size: 18.5px; line-height: 1.55;
  color: #4a330c; text-align: center;
}

</style>
</head>
<body>
<canvas id="gl" aria-label="לוח המשחק"></canvas>

<div id="hud">
  <div id="top">
    <div id="players"></div>
    <div id="statusbar"><div id="status"></div><div id="dice" aria-label="קוביות"></div></div>
    <div id="ticker" data-act="log"></div>
    <div id="fabs">
      <button class="fab" data-act="rot" aria-label="סובב את הלוח"></button>
      <button class="fab" data-act="costs" aria-label="מחירון">📋</button>
      <button class="fab" data-act="menu" aria-label="תפריט">☰</button>
    </div>
  </div>
  <div id="bottom">
    <div id="hand"></div>
    <div id="actions"></div>
  </div>
</div>

<div id="errbar" class="hidden"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheetWrap" class="hidden"><div id="sheet"></div></div>
<div id="lobby" class="overlay"></div>
<div id="winner" class="overlay soft hidden"></div>
<div id="curtain" class="overlay soft hidden"></div>

<script>
/* ===== ENGINE: חוקי המשחק (כמו קטאן) ===== */
(function (root) {
'use strict';

const RES = ['avo', 'stone', 'metal', 'horse', 'hay'];
const COST = {
  road:    { avo: 1, stone: 1 },
  house:   { avo: 1, stone: 1, metal: 1, horse: 1 },
  commune: { avo: 2, stone: 3 },
  dev:     { stone: 1, hay: 1, horse: 1 },
};
const LIMITS = { road: 15, house: 5, commune: 4 };
const DEV_COUNTS = { knight: 14, vp: 5, roads: 2, plenty: 2, monopoly: 2 };
const TERRAIN = [
  'avo', 'avo', 'avo', 'avo',
  'horse', 'horse', 'horse', 'horse',
  'hay', 'hay', 'hay', 'hay',
  'stone', 'stone', 'stone',
  'metal', 'metal', 'metal',
  'desert',
];
const NUMBERS = [2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12];
const RES_NAME = { avo: 'אבוקדו', stone: 'אבן', metal: 'מתכת', horse: 'כבשה', hay: 'חציר' };
const DEV_NAME = { knight: 'אביר', vp: 'נקודת ניצחון', roads: 'בניית דרכים', plenty: 'בחירת 2 משאבים', monopoly: 'מונופול' };

/* ---------- גאומטריה קבועה של הלוח ---------- */
function buildGeo() {
  const SQ3 = Math.sqrt(3);
  const hexes = [];
  for (let r = -2; r <= 2; r++) {
    for (let q = -2; q <= 2; q++) {
      if (Math.abs(q + r) > 2) continue;
      hexes.push({ q, r, x: SQ3 * (q + r / 2), z: 1.5 * r });
    }
  }
  const verts = [], edges = [];
  const vmap = new Map(), emap = new Map();
  const vkey = (x, z) => Math.round(x * 100) + ',' + Math.round(z * 100);

/* ---------- עזרים ---------- */

const clone = (o) => JSON.parse(JSON.stringify(o));
const emptyRes = () => ({ avo: 0, stone: 0, metal: 0, horse: 0, hay: 0 });
const total = (res) => RES.reduce((s, r) => s + (res[r] || 0), 0);

/* ---------- יצירת משחק ---------- */
function newGame(names, rnd) {

  // פיזור אקראי: מספר המשבצות מכל משאב משתנה (2 עד 5), ומיקום המדבר אקראי
  const cnt = [4, 4, 4, 3, 3];
  for (let i = 0; i < 6; i++) {
    const a = Math.floor(rnd() * 5), b = Math.floor(rnd() * 5);
    if (a !== b && cnt[a] < 5 && cnt[b] > 2) { cnt[a]++; cnt[b]--; }
  }
  const kinds = ['avo', 'horse', 'hay', 'stone', 'metal'];
  const terrList = ['desert'];
  kinds.forEach((k, i) => { for (let j = 0; j < cnt[i]; j++) terrList.push(k); });
  // פיזור הגיוני: משתדלים שלא יהיו שני משבצות מאותו משאב צמודות זו לזו
  let terr = null, bestTerr = null, bestBad = 1e9;
  for (let tries = 0; tries < 4000; tries++) {
    const cand = shuffle(terrList.slice(), rnd);
    let bad = 0;
    for (let i = 0; i < 19; i++) {
      for (const j of GEO.hexes[i].nb) if (j > i && cand[j] === cand[i] && cand[i] !== 'desert') bad++;
    }
    if (bad < bestBad) { bestBad = bad; bestTerr = cand; }
    if (bad === 0) break;
  }
  terr = bestTerr;
  let assign = null;
  for (let tries = 0; tries < 500; tries++) {
    const nums = shuffle(NUMBERS.slice(), rnd);
    let k = 0;
    const cand = terr.map((t) => (t === 'desert' ? 0 : nums[k++]));
    let ok = true;
    for (let i = 0; i < 19 && ok; i++) {
      if (cand[i] === 6 || cand[i] === 8) {
        for (const j of GEO.hexes[i].nb) if (cand[j] === 6 || cand[j] === 8) { ok = false; break; }
      }
    }
    assign = cand;
    if (ok) break;
  }

  const steps = shuffle([4, 4, 4, 3, 3, 3, 3, 3, 3], rnd);
  const ptypes = shuffle(['any', 'any', 'any', 'any', 'avo', 'stone', 'metal', 'horse', 'hay'], rnd);

  Object.keys(DEV_COUNTS).forEach((k) => { for (let i = 0; i < DEV_COUNTS[k]; i++) deck.push(k); });

  for (let i = 0; i < n; i++) order.push(i);
  for (let i = n - 1; i >= 0; i--) order.push(i);

  const st = {
    v: 1, id: randId(), rev: 0, n,
    players: names.map((name, i) => ({
      name, color: i, res: emptyRes(), dev: [], newDev: [], knights: 0,
    })),
    hexes, ports,
    robber: terr.indexOf('desert'),
    vo: {}, eo: {},
    bank: { avo: 19, stone: 19, metal: 19, horse: 19, hay: 19 },
    deck,
    phase: 'setup_house', turn: 0,
    setup: { order, idx: 0 }, setupLast: -1,
    dice: null, rollN: 0, turnNo: 0,

/* ---------- שאילתות מצב ---------- */
function vertexFree(st, v) {

      if (o.p === p) return true;

}

}
function legalRoads(st, p) {
  const out = [];
  GEO.edges.forEach((E) => { if (canRoadAt(st, p, E.id)) out.push(E.id); });
  return out;
}
function legalHouses(st, p) {
  const out = [];
  GEO.verts.forEach((V) => { if (canHouseAt(st, p, V.id)) out.push(V.id); });
  return out;
}
function legalCommunes(st, p) {
  const out = [];
  for (const k in st.vo) if (st.vo[k].p === p && !st.vo[k].c) out.push(+k);
  return out;
}
function setupHouses(st) {
  const out = [];
  GEO.verts.forEach((V) => { if (vertexFree(st, V.id)) out.push(V.id); });
  return out;
}
function setupRoads(st) {
  const v = st.setupLast;

}
function ratios(st, p) {
  const r = {};
  RES.forEach((x) => { r[x] = 4; });
  st.ports.forEach((pt) => {
    const E = GEO.edges[pt.e];
    const own = [E.a, E.b].some((v) => st.vo[v] && st.vo[v].p === p);
    if (!own) return;
    if (pt.type === 'any') RES.forEach((x) => { r[x] = Math.min(r[x], 3); });

}
function robberVictims(st, h, me) {
  const set = {};

  return Object.keys(set).map(Number);
}
function roadLen(st, p) {

    const e = +k, E = GEO.edges[e];

/* ---------- עדכון פרסים ---------- */
function updateAwards(st) {
  const lens = st.players.map((_, p) => roadLen(st, p));

  if (best >= 5) {
    if (holder >= 0 && lens[holder] === best) { /* נשאר */ }

      const top = [];
      lens.forEach((l, p) => { if (l === best) top.push(p); });
      holder = top.length === 1 ? top[0] : -1;
    }
  } else holder = -1;
  if (holder !== st.longest.p && holder >= 0) st.log.push(st.players[holder].name + ' קיבל את הדרך הארוכה ביותר (' + lens[holder] + ')');

    kn.forEach((k, p) => { if (k === mx) top.push(p); });
    if (top.length === 1) ah = top[0];
  }
  if (ah !== st.army.p && ah >= 0) st.log.push(st.players[ah].name + ' קיבל את הצבא הגדול ביותר (' + kn[ah] + ')');

function checkWin(st) {

}

/* ---------- ייצור משאבים ---------- */
function produce(st, sum) {

    if (H.num !== sum || H.type === 'desert' || hi === st.robber) return;
    st.hot.push(hi);
    for (const v of h.v) {

      if (o) gains[o.p][H.type] += o.c ? 2 : 1;
    }

    if (tot === 0) return;

    } else {
      const who = [];
      gains.forEach((g, p) => { if (g[r] > 0) who.push(p); });

    });
    parts.push(st.players[p].name + ': ' + RES.filter((r) => g[r]).map((r) => g[r] + ' ' + RES_NAME[r]).join(', '));
  });
  st.log.push(parts.length ? 'הפקה — ' + parts.join(' | ') : 'אף אחד לא קיבל משאבים.');

function pay(st, p, cost) {

function give(st, p, r, n) {

/* ---------- הפעלת פעולה ---------- */

    case 'buy_dev': {

      if (!st.deck.length) return fail('הקלפים נגמרו');
      if (!canAfford(P.res, COST.dev)) return fail('אין מספיק משאבים');
      pay(st, me, COST.dev);
      P.newDev.push(st.deck.pop());
      st.log.push(nm(me) + ' קנה קלף מיוחד');
      break;
    }
    case 'play_dev': {
      if (st.phase !== 'roll' && st.phase !== 'main') return fail('עכשיו לא ניתן לשחק קלף');
      if (st.devPlayed) return fail('כבר שיחקת קלף בתור הזה');
      const i = P.dev.indexOf(a.card);
      if (i < 0 || a.card === 'vp') return fail('אין לך קלף כזה');
      if (a.card === 'knight') {
        P.dev.splice(i, 1);
        P.knights++;

        st.log.push(nm(me) + ' שיחק אביר');
        beginRobber(st, st.phase);
        updateAwards(st);

        st.phase = 'roadbuild';

        st.devPlayed = true;
        give(st, me, a.a, 1); give(st, me, a.b, 1);

      } else if (a.card === 'monopoly') {
        if (RES.indexOf(a.res) < 0) return fail('בחר משאב');

        st.players.forEach((Q, p) => {
          if (p === me) return;
          got += Q.res[a.res]; P.res[a.res] += Q.res[a.res]; Q.res[a.res] = 0;
        });
        st.log.push(nm(me) + ' שיחק מונופול על ' + RES_NAME[a.res] + ' וקיבל ' + got);

    case 'bank_trade': {

      if (P.res[a.give] < ratio) return fail('צריך ' + ratio + ' ' + RES_NAME[a.give]);
      if (st.bank[a.get] < 1) return fail('אין בבנק ' + RES_NAME[a.get]);
      P.res[a.give] -= ratio; st.bank[a.give] += ratio;
      P.res[a.get] += 1; st.bank[a.get] -= 1;
      st.log.push(nm(me) + ' החליף ' + ratio + ' ' + RES_NAME[a.give] + ' ב-' + RES_NAME[a.get] + ' מול הבנק');

    }
    case 'offer_trade': {

        if (x > P.res[r]) return fail('אין לך מספיק ' + RES_NAME[r]);

      if (!tg || !tw) return fail('צריך לתת ולבקש משהו');

      if (to !== -1 && (to === me || !st.players[to])) return fail('שחקן לא חוקי');
      st.trade = { from: me, to, give: g, get: w, no: [] };
      st.log.push(nm(me) + ' הציע סחר');

      if (!T) return fail('אין הצעה פעילה');
      const q = a.p;
      if (q === T.from || !st.players[q] || (T.to !== -1 && T.to !== q)) return fail('ההצעה לא מיועדת לך');
      if (a.accept) {

        if (!canAfford(F.res, T.give)) { st.trade = null; return fail('המציע כבר לא יכול לספק את ההצעה'); }
        RES.forEach((r) => {
          const x = T.give[r] || 0, y = T.get[r] || 0;

        st.trade = null;
      } else {
        if (T.no.indexOf(q) < 0) T.no.push(q);

    case 'cancel_trade': {

      break;
    }

      return fail('פעולה לא מוכרת');

  if (st) st.ports.forEach((pt) => {
    const p = portPos(pt), rx = p.x * ca - p.z * sa, rz = p.x * sa + p.z * ca;
    const r = 0.4;
    if (rx - r < a) a = rx - r; if (rx + r > b) b = rx + r; if (rz - r < c) c = rz - r; if (rz + r > d) d = rz + r;

function layout() {
  ca = Math.cos(view.az); sa = Math.sin(view.az);

  const bt = document.getElementById('bottom');
  const top = fb ? fb.getBoundingClientRect().bottom + 4 : 150;
  const bottom = bt ? H - bt.getBoundingClientRect().top + 2 : 200;
  const availH = Math.max(160, H - top - bottom);
  const e = extents();
  const bw = e.b - e.a + 0.1, bh = e.d - e.c + 0.1;
  const sW = (W + 2) / bw;
  tilt = clamp((availH / sW - (T + 0.6)) / bh, 0.58, 0.8);
  const sH = availH / (bh * tilt + T + 0.6);

  cx = W / 2 + view.px - ((e.a + e.b) / 2) * scale;
  cy = top + availH / 2 + view.py - ((e.c + e.d) / 2) * scale * tilt + 0.1 * scale;
}

function drawHills() {

  const horizon = cy - scale * 3.3;
  const bands = [
    { y: horizon - scale * 1.1, c: 'rgba(90,150,160,.22)', amp: 0.55, freq: 0.9 },
    { y: horizon - scale * 0.55, c: 'rgba(70,130,120,.28)', amp: 0.75, freq: 1.3 },
    { y: horizon - scale * 0.1, c: 'rgba(50,105,95,.34)', amp: 0.6, freq: 1.8 },
  ];
  bands.forEach((b, bi) => {
    ctx.beginPath(); ctx.moveTo(-20, b.y + scale);
    for (let x = -20; x <= W + 20; x += 18) {
      const y = b.y - (Math.sin(x * 0.01 * b.freq + bi * 7) * 0.5 + Math.sin(x * 0.004 * b.freq + bi * 3) * 0.5 + 1) * scale * b.amp * 0.5;

}

/* ---------- אחסון מקומי ---------- */
function saveLocal() {
  try { localStorage.setItem('komuna:save', JSON.stringify({ opts, state: G })); } catch (_) {}
}
function loadLocal() {

  } catch (_) {}

}
function clearLocal() { try { localStorage.removeItem('komuna:save'); } catch (_) {} }
function dedDismissed() { try { return localStorage.getItem('komuna:ded') === '1'; } catch (_) { return false; } }

/* ---------- עזרים ---------- */

const PIPS = { 1: [[5, 5]], 2: [[3, 3], [7, 7]], 3: [[3, 3], [5, 5], [7, 7]], 4: [[3, 3], [7, 3], [3, 7], [7, 7]], 5: [[3, 3], [7, 3], [5, 5], [3, 7], [7, 7]], 6: [[3, 2.5], [7, 2.5], [3, 5], [7, 5], [3, 7.5], [7, 7.5]] };

    (PIPS[n] || []).map((p) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="0.85" fill="#222"/>').join('') + '</svg></div>';
}
function logoSVG() {
  const s = 24, cols = ['#4f8a2b', '#a9713a', '#d9a93a', '#9a9a92', '#5f7f99', '#4f8a2b', '#ebd8a4'];
  const emo = ['avo', 'horse', 'hay', 'stone', 'metal', 'avo', 'dunes'];
  const ax = [[0, 0], [1, 0], [-1, 0], [0, 1], [-1, 1], [0, -1], [1, -1]];
  let out = '<svg class="logo" viewBox="-62 -58 124 116" aria-hidden="true">';
  ax.forEach((a, i) => {
    const cx = Math.sqrt(3) * s * (a[0] + a[1] / 2) * 0.98, cy = 1.5 * s * a[1] * 0.98;
    let pts = '';
    for (let k = 0; k < 6; k++) {
      const an = (60 * k - 30) * Math.PI / 180;
      pts += (cx + Math.cos(an) * s * 0.93).toFixed(1) + ',' + (cy + Math.sin(an) * s * 0.93).toFixed(1) + ' ';
    }
    out += '<polygon points="' + pts + '" fill="' + cols[i] + '" stroke="#f3ead0" stroke-width="2.2" stroke-linejoin="round"/>';
    out += '<g transform="translate(' + (cx - 11).toFixed(1) + ' ' + (cy - 11).toFixed(1) + ') scale(.92)">' + ICONS.B[emo[i]] + '</g>';
  });
  return out + '</svg>';
}

/* ---------- זהות הצופה ---------- */
function myTurn() {
  if (!G) return false;
  if (mode === 'local') return true;
  return mySeat >= 0 && mySeat === G.turn;
}
function viewer() {
  if (!G) return 0;
  if (mode === 'online') return mySeat;
  if (G.phase === 'discard') {
    const k = Object.keys(G.discard).map(Number);
    if (k.length) return k[0];
  }
  return G.turn;
}
function responder() {
  const T = G && G.trade;
  if (!T) return -1;
  if (mode === 'online') {
    if (mySeat < 0 || mySeat === T.from) return -1;
    if (T.to !== -1 && T.to !== mySeat) return -1;
    return T.no.indexOf(mySeat) >= 0 ? -1 : mySeat;
  }
  for (let i = 0; i < G.n; i++) {
    if (i === T.from) continue;
    if (T.to !== -1 && T.to !== i) continue;
    if (T.no.indexOf(i) >= 0) continue;
    return i;
  }
  return -1;
}

/* ---------- ביצוע פעולות ---------- */
function act(a) {
  if (!G) return false;
  const r = E.apply(G, a);
  if (!r.ok) { toast(r.err); return false; }
  commit(r.state);
  return true;
}
function commit(ns) {
  G = ns;
  if (mode === 'local') saveLocal();
  else if (mode === 'online') pushOnline(ns);
  render();
}
function pushOnline(ns) {
  if (!gdoc || !docData) return;
  const d = JSON.parse(JSON.stringify(docData));
  d.state = ns;
  docData = d;
  writing = writing.then(() => gdoc.set(d)).catch((err) => {
    console.error(err);
    toast('השמירה לענן נכשלה. נסו שוב.');
  });
}

/* ---------- אונליין ---------- */
async function initCaps() {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      db = await window.claude.use('db');
      userCap = await window.claude.use('user');
      uid = userCap ? await userCap.id() : null;
    }
  } catch (e) { db = null; }
  onlineOK = !!(db && uid);
  capsDone = true;
  if (!G && mode === null && !$('#lobby').classList.contains('hidden')) showLobby();
}
let onlineStage = 'choice', inviteCode = null, joinErr = '', joinDigits = '', joinBusy = false;
function genCode() { return String(Math.floor(100000 + Math.random() * 900000)); }
function openOnlineChoice() {
  if (!onlineOK) return;
  mode = 'online'; onlineStage = 'choice'; inviteCode = null; joinErr = ''; joinDigits = ''; joinBusy = false;
  if (unsub) { try { unsub(); } catch (_) {} unsub = null; }
  gdoc = null; docData = null; mySeat = -1;
  showOnlineLobby();
}
function subscribeGdoc() {
  if (unsub) { try { unsub(); } catch (_) {} }

    docData = snap.exists ? snap.data() : null;
    onDoc();
  }, (err) => { toast('שגיאת חיבור: ' + (err && err.code ? err.code : '')); });
}
function onDoc() {
  mySeat = -1;
  if (docData && docData.seats) for (const k in docData.seats) if (docData.seats[k] === uid) mySeat = +k;
  if (docData && docData.state) {
    const ns = docData.state;
    if (!G || G.id !== ns.id || ns.rev >= G.rev) G = ns;
    hideLobby();
    render();
    if (sheetKind === 'chat') drawSheet();
    return;
  }
  G = null;
  if (!docData && onlineStage === 'enter' && joinBusy) { joinErr = 'הקוד הזה לא נמצא. בדקו שהקלדתם נכון.'; joinBusy = false; gdoc = null; if (unsub) { try { unsub(); } catch (_) {} unsub = null; } }
  showOnlineLobby();
}
function sendChat(text) {
  text = (text || '').trim().slice(0, 300);
  if (!text || !gdoc || !docData || mySeat < 0) return;
  const d = JSON.parse(JSON.stringify(docData));
  const nm = (d.names && d.names[mySeat]) || myName;
  d.chat = (d.chat || []).concat([{ p: mySeat, n: nm, t: text, ts: Date.now() }]).slice(-60);
  docData = d;
  writing = writing.then(() => gdoc.set(d)).catch(() => toast('שליחת ההודעה נכשלה'));
}
function codeDisp(c) { return c ? c.slice(0, 3) + ' ' + c.slice(3) : ''; }

        '<div class="seg">' + [2, 3, 4].map((n) => '<button data-act="onN" data-n="' + n + '" class="' + (onlineS.n === n ? 'sel' : '') + '">' + n + ' שחקנים</button>').join('') + '</div>' +

function codeCard(d) {

    '<div class="row" style="margin-top:4px"><input readonly id="inviteOut" value="' + esc(d.code || inviteCode || '') + '" style="font-size:30px;letter-spacing:8px;text-align:center;font-family:\'Suez One\',Georgia,serif" class="grow">' +

function waitCard(d) {

  for (let i = 0; i < d.n; i++) {

    h += '</div>';
  }

function readName() {
  const el = $('#myName');
  if (el && el.value.trim()) myName = el.value.trim().slice(0, 14);
}
function onlineCreateGo() {
  readName();
  inviteCode = genCode();
  gdoc = db.doc('games/' + inviteCode);
  subscribeGdoc();
  const d = { n: onlineS.n, seats: { 0: uid }, names: { 0: myName }, state: null, code: inviteCode };
  docData = d;
  gdoc.set(d).catch(() => toast('לא הצלחתי ליצור משחק'));
  showOnlineLobby();
}
function onlineJoinGo() {
  if (joinDigits.length !== 6) return;
  readName();
  joinErr = ''; joinBusy = true;
  inviteCode = joinDigits;
  gdoc = db.doc('games/' + inviteCode);
  subscribeGdoc();
  showOnlineLobby();
}
function namesOf(d) {
  const out = [];
  for (let i = 0; i < d.n; i++) out.push((d.names && d.names[i]) || 'שחקן ' + (i + 1));
  return out;
}
function onlineJoin(seat) {
  readName();
  if (!docData || docData.seats[seat]) return;
  const d = JSON.parse(JSON.stringify(docData));
  d.seats[seat] = uid;
  d.names[seat] = myName;
  if (Object.keys(d.seats).length >= d.n) d.state = E.newGame(namesOf(d));
  docData = d;
  gdoc.set(d).catch(() => toast('לא הצלחתי להצטרף'));
}
function onlineStartNow() {
  const d = JSON.parse(JSON.stringify(docData));
  const ks = Object.keys(d.seats).map(Number).sort();
  if (ks.length < 2) return;
  const seats = {}, names = {};
  ks.forEach((k, i) => { seats[i] = d.seats[k]; names[i] = d.names[k]; });
  d.seats = seats; d.names = names; d.n = ks.length;
  d.state = E.newGame(namesOf(d));
  docData = d;
  gdoc.set(d).catch(() => toast('לא הצלחתי להתחיל'));
}

/* ---------- התחלת משחק מקומי ---------- */
function startLocal() {
  const names = [];
  for (let i = 0; i < lobbyS.n; i++) names.push((lobbyS.names[i] || '').trim() || 'שחקן ' + (i + 1));
  opts = { hide: lobbyS.hide };
  mode = 'local';
  G = E.newGame(names);
  lastViewer = -1; armed = null;
  saveLocal();
  hideLobby();
  render();
  toast('כל שחקן מציב בית ודרך. מתחיל: ' + esc(names[0]), 3200);
}
function resumeLocal() {
  const s = loadLocal();
  if (!s) return;
  opts = s.opts || { hide: true };
  mode = 'local'; G = s.state; lastViewer = -1; armed = null;
  hideLobby();
  render();
}

/* ---------- ציור הממשק ---------- */
function render() {
  if (!G) return;
  try { Scene3D.sync(G); } catch (e) { console.error(e); showErr('3D: ' + e.message); }
  if (G.phase !== 'main' || !myTurn()) armed = null;
  checkCurtain();
  renderTop();
  renderHand();
  updateTargets();
  renderActions();
  if (G.id !== diceGame) { diceGame = G.id; rollingUntil = 0; lastRollShown = G.rollN; }
  rollAnim();
  drawDice();
  showGains();
  autoSheets();
  if (sheetKind && sheetKind !== 'codeShow' && sheetKind !== 'codeLoad') drawSheet();
  checkWinner();
}

    case 'roll': return ic('dice') + n + ': הטל קוביות';
    case 'main': return ic('commune') + n + ': בנה, סחור או סיים תור' + (G.trade ? ' · יש הצעת סחר' : '');
    case 'robber': return ic('robber') + n + ': הזז את השודד למשבצת אחרת';
    case 'roadbuild': return ic('road') + n + ': בנה דרך חינם (נותרו ' + G.rb + ')';
    case 'discard': return ic('layers') + 'זורקים חצי מהקלפים: ' + Object.keys(G.discard).map((k) => esc(G.players[k].name)).join(', ');
    case 'over': return ic('trophy') + 'המשחק נגמר';
  }

}
function renderTop() {
  const v = viewer();
  $('#players').innerHTML = G.players.map((P, i) => {
    const vp = E.vpOf(G, i, i === v && !curtainOn && (mode === 'online' || G.turn === i));
    const badges = (G.longest.p === i ? '<span class="badge" title="הדרך הארוכה">' + I('road') + '2</span>' : '') + (G.army.p === i ? '<span class="badge" title="הצבא הגדול">' + I('shield') + '2</span>' : '');
    const devs = P.dev.length + P.newDev.length;
    return '<div class="pcard ' + (G.turn === i && G.phase !== 'over' ? 'turn' : '') + '" style="--pc:' + PCOL[i] + '"><div class="nm">' + esc(P.name) + (mode === 'online' && i === mySeat ? ' (אני)' : '') +
      '</div><div class="vp">' + vp + '<small>נק׳</small>' + badges + '</div><div class="st" title="קלפי משאב · קלפים מיוחדים · אבירים · אורך דרך">' + I('layers') + E.total(P.res) + I('card') + devs + I('shield') + P.knights + I('road') + (G.lens ? G.lens[i] : 0) + '</div></div>';
  }).join('');

}
function renderHand() {
  const v = viewer();
  const hidden = v < 0 || curtainOn;
  const P = hidden ? null : G.players[v];
  const rat = hidden ? null : E.ratios(G, v);
  let h = '';
  R.forEach((r) => {
    h += '<div class="chip" style="--rc:var(--c-' + r + ')" title="' + RN[r] + '"><span class="ic">' + RI[r] + '</span><span class="n">' + (P ? P.res[r] : '·') + '</span>' +
      (rat && rat[r] < 4 ? '<span class="rt">' + rat[r] + ':1</span>' : '') + '</div>';
  });

}
let lastRollShown = -1;

  if (!G || G.id !== diceGame || !G.dice || G.rollN === lastRollShown) return;

  const box = $('#dice');

    box.innerHTML = dieHTML(a, 'roll') + dieHTML(b, 'roll');

  }

/* ---------- יעדים על הלוח ---------- */
function computeTargets() {
  if (!G || G.phase === 'over' || curtainOn || !myTurn()) return null;
  const ph = G.phase, me = G.turn;
  if (ph === 'setup_house') return { kind: 'v', ids: E.setupHouses(G) };
  if (ph === 'setup_road') return { kind: 'e', ids: E.setupRoads(G) };
  if (ph === 'roadbuild') return { kind: 'e', ids: E.legalRoads(G, me) };
  if (ph === 'robber') { const ids = []; for (let i = 0; i < 19; i++) if (i !== G.robber) ids.push(i); return { kind: 'h', ids }; }
  if (ph === 'main' && armed === 'road') return { kind: 'e', ids: E.legalRoads(G, me) };
  if (ph === 'main' && armed === 'house') return { kind: 'v', ids: E.legalHouses(G, me) };
  if (ph === 'main' && armed === 'commune') return { kind: 'v', ids: E.legalCommunes(G, me) };
  return null;
}
function updateTargets() {
  const t = computeTargets();
  if (selT && (!t || t.kind !== selT.kind || t.ids.indexOf(selT.id) < 0)) selT = null;
  Scene3D.setSelected(selT);
  if (t && t.ids.length && !sheetKind) Scene3D.setTargets(t.kind, t.ids);
  else Scene3D.setTargets(null, null);
}
function confirmSel() {
  if (!selT || !G || !myTurn()) return;
  const hit = selT, ph = G.phase;
  selT = null;
  Scene3D.setSelected(null);
  if (hit.kind === 'v') {
    if (ph === 'setup_house' || armed === 'house') { if (act({ t: 'house', v: hit.id })) armed = null; }
    else if (armed === 'commune') { if (act({ t: 'commune', v: hit.id })) armed = null; }
  } else if (hit.kind === 'e') {
    if (ph === 'setup_road' || ph === 'roadbuild') act({ t: 'road', e: hit.id });
    else if (armed === 'road') { if (act({ t: 'road', e: hit.id })) armed = null; }
  } else if (hit.kind === 'h' && ph === 'robber') {
    const vic = E.robberVictims(G, hit.id, G.turn);
    if (vic.length > 1) openSheet('victim', { h: hit.id, vic });
    else act({ t: 'robber', h: hit.id, r: Math.random() });
  }
  render();
}
function onBoardTap(hit) {
  if (!G || !myTurn() || sheetKind || curtainOn) return;
  const t = computeTargets();
  if (!t || t.kind !== hit.kind) return;
  if (selT && selT.kind === hit.kind && selT.id === hit.id) { confirmSel(); return; }
  selT = { kind: hit.kind, id: hit.id };
  Scene3D.setSelected(selT);
  renderActions();
}

    } else {
      h += '<h3>אני נותן</h3><div class="stepper">' + R.map((r) => stp(r, S.pg[r] || 0, 'pg', P.res[r])).join('') + '</div>';
      h += '<h3>אני מבקש</h3><div class="stepper">' + R.map((r) => stp(r, S.pw[r] || 0, 'pw', 9)).join('') + '</div>';
      if (G.n > 2) {
        h += '<h3>למי</h3><div class="seg"><button class="' + (S.to === -1 ? 'sel' : '') + '" data-act="to" data-i="-1">כולם</button>' +
          G.players.map((Q, i) => (i === v ? '' : '<button class="' + (S.to === i ? 'sel' : '') + '" data-act="to" data-i="' + i + '">' + esc(Q.name) + '</button>')).join('') + '</div>';
      }
      const ok = sumOf(S.pg) > 0 && sumOf(S.pw) > 0;
      h += '<div style="margin-top:14px"><button class="btn pri wide" style="width:100%" data-act="offer" ' + (ok ? '' : 'disabled') + '>שלח הצעה</button></div>';
    }
    return h;
  },
  trade_resp() {
    const T = G.trade, p = sheetState.p;
    if (!T) return '';
    const Q = G.players[p], F = G.players[T.from];
    const can = E.canAfford(Q.res, T.get);
    return '<h2>הצעת סחר</h2><p style="font-size:17px;line-height:1.5"><b>' + esc(F.name) + '</b> מציע ל<b>' + esc(Q.name) + '</b>:<br>נותן: <b>' + listIcons(T.give) + '</b><br>ורוצה: <b>' + listIcons(T.get) + '</b></p>' +
      (can ? '' : '<p class="err">אין לך מספיק קלפים כדי לקבל.</p>') +
      '<div class="row"><button class="btn pri grow" data-act="accept" ' + (can ? '' : 'disabled') + '>קבל</button><button class="btn grow" data-act="decline">דחה</button></div>';
  },
  confirmNew() {
    return '<h2>משחק חדש? ' + X + '</h2><p class="note">' + (mode === 'online' ? 'המשחק הנוכחי יימחק לכל השחקנים.' : 'ההתקדמות במשחק הנוכחי תאבד.') + '</p><div class="row"><button class="btn warn grow" data-act="newGo">כן, משחק חדש</button><button class="btn grow" data-act="close">ביטול</button></div>';
  },
  codeShow() {
    const S = sheetState;
    return '<h2>קוד משחק ' + X + '</h2><p class="note">שולחים את הקוד בהודעה, והמקבל בוחר "טען קוד משחק". כך אפשר להמשיך משחק גם בלי חיבור אונליין. ' + (mode === 'local' ? '' : 'שימו לב: הקוד חושף את הקלפים של כולם.') + '</p><textarea readonly id="codeOut">' + esc(S.code || 'מכין קוד…') + '</textarea><div class="row" style="margin-top:8px"><button class="btn pri grow" data-act="copyCode">העתק</button></div>';
  },
  codeLoad() {
    const S = sheetState;
    return '<h2>טעינת קוד משחק ' + X + '</h2><textarea id="codeIn" placeholder="הדביקו כאן את הקוד"></textarea>' + (S.err ? '<p class="err">' + esc(S.err) + '</p>' : '') + '<div class="row" style="margin-top:8px"><button class="btn pri grow" data-act="loadCode">טען</button></div>';
  },
};
function drawSheet() {
  if (!sheetKind) return;
  const f = SHEETS[sheetKind];
  const html = f ? f() : '';
  if (!html) { closeSheet(); return; }
  const keepIn = sheetKind === 'chat' ? ($('#chatIn') ? $('#chatIn').value : '') : '';
  $('#sheet').innerHTML = html;
  const w = $('#sheetWrap');
  w.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('show')));
  if (sheetKind === 'chat') {
    chatSeen = ((docData && docData.chat) || []).length;
    const body = $('#chatBody');
    if (body) body.scrollTop = body.scrollHeight;
    const inp = $('#chatIn');
    if (inp && keepIn) inp.value = keepIn;
  }
}
function autoSheets() {
  if (!G) return;
  if (G.phase === 'discard') {
    let need = -1;
    if (mode === 'local') need = Number(Object.keys(G.discard)[0]);
    else if (G.discard[mySeat] !== undefined) need = mySeat;
    if (need >= 0 && !curtainOn && sheetKind !== 'discard') openSheet('discard', { p: need, sel: {} });
    if (need < 0 && sheetKind === 'discard') closeSheet();
    if (need >= 0 && sheetKind === 'discard' && sheetState.p !== need) openSheet('discard', { p: need, sel: {} });
  } else if (sheetKind === 'discard') closeSheet();
  const rs = responder();
  if (rs >= 0 && !curtainOn && !sheetKind) openSheet('trade_resp', { p: rs });
  if (rs < 0 && sheetKind === 'trade_resp') closeSheet();
  if (rs >= 0 && sheetKind === 'trade_resp' && sheetState.p !== rs) openSheet('trade_resp', { p: rs });
}

/* ---------- קוד משחק (דחוס) ---------- */
function toB64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function encodeState(st) {
  const txt = JSON.stringify(st);
  if (window.CompressionStream) {
    const cs = new CompressionStream('gzip'), w = cs.writable.getWriter();
    w.write(new TextEncoder().encode(txt)); w.close();
    return 'K1.' + toB64(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
  }
  return 'K0.' + btoa(unescape(encodeURIComponent(txt)));
}
async function decodeState(code) {
  code = code.trim().replace(/\s+/g, '');
  let txt;
  if (code.indexOf('K1.') === 0) {
    const ds = new DecompressionStream('gzip'), w = ds.writable.getWriter();
    w.write(fromB64(code.slice(3))); w.close();
    txt = new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
  } else if (code.indexOf('K0.') === 0) txt = decodeURIComponent(escape(atob(code.slice(3))));
  else throw new Error('קוד לא מוכר');
  const st = JSON.parse(txt);
  if (!st || !st.players || !st.hexes || !st.vo) throw new Error('הקוד לא של המשחק הזה');
  return st;
}

/* ---------- טיפול בלחיצות ---------- */
function handle(a, d) {
  const S = sheetState;
  switch (a) {
    /* לובי */
    case 'lobbyN': lobbyS.n = +d.n; showLobby(); return;
    case 'dedClose': dedDismiss(); return;
    case 'startLocal': startLocal(); return;
    case 'resume': resumeLocal(); return;
    case 'goOnline': openOnlineChoice(); return;
    case 'lobbyBack':
      if (mode === 'online' && onlineStage !== 'choice') {
        readName();
        if (unsub) { try { unsub(); } catch (_) {} unsub = null; }
        gdoc = null; docData = null; mySeat = -1; joinErr = ''; joinBusy = false;
        onlineStage = 'choice'; showOnlineLobby();
      } else showLobby();
      return;
    case 'onChoiceInvite': readName(); onlineStage = 'create'; showOnlineLobby(); return;
    case 'onChoiceEnter': readName(); onlineStage = 'enter'; joinErr = ''; joinDigits = ''; showOnlineLobby(); return;
    case 'onN': readName(); onlineS.n = +d.n; showOnlineLobby(); return;
    case 'onCreateGo': onlineCreateGo(); return;
    case 'onJoinGo': onlineJoinGo(); return;
    case 'onJoin': onlineJoin(+d.i); return;
    case 'onStartNow': onlineStartNow(); return;
    case 'copyInvite': {
      const el = $('#inviteOut');
      if (!el) return;
      el.focus(); el.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      if (!ok && navigator.clipboard) { navigator.clipboard.writeText(el.value).then(() => toast('הקוד הועתק')).catch(() => toast('סמנו והעתיקו ידנית')); return; }
      toast(ok ? 'הקוד הועתק' : 'סמנו והעתיקו ידנית');
      return;
    }
    /* שכבות */
    case 'curtainOk': lastViewer = viewer(); curtainOn = false; $('#curtain').classList.add('hidden'); render(); return;
    case 'winner': openWinner(); return;
    case 'winClose': $('#winner').classList.add('hidden'); return;
    /* מצלמה ותפריט */
    case 'cam': Scene3D.toggleTop(); return;
    case 'rot': Scene3D.rotate(Math.PI / 3); return;
    case 'menu': openSheet('menu'); return;
    case 'costs': openSheet('costs'); return;
    case 'log': openSheet('log'); return;
    case 'chat': openSheet('chat'); return;
    case 'sendChat': { const el = $('#chatIn'); if (el && el.value.trim()) { sendChat(el.value); el.value = ''; drawSheet(); } return; }
    case 'close': closeSheet(); return;
    case 'toLobby': showLobby(); return;
    case 'newAsk': $('#winner').classList.add('hidden'); openSheet('confirmNew'); return;
    case 'newGo':
      closeSheet();
      if (mode === 'online' && gdoc) { G = null; gdoc.delete().catch(() => toast('המחיקה נכשלה')); }
      else { clearLocal(); showLobby(); }
      return;
    case 'codeShow':
      openSheet('codeShow', { code: '' });
      encodeState(G).then((c) => { if (sheetKind === 'codeShow') { sheetState.code = c; drawSheet(); } }).catch(() => toast('לא הצלחתי ליצור קוד'));
      return;
    case 'codeLoad': openSheet('codeLoad', {}); return;
    case 'copyCode': {
      const ta = $('#codeOut');
      if (!ta) return;
      ta.focus(); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      if (!ok && navigator.clipboard) { navigator.clipboard.writeText(ta.value).then(() => toast('הקוד הועתק')).catch(() => toast('סמנו והעתיקו ידנית')); return; }
      toast(ok ? 'הקוד הועתק' : 'סמנו והעתיקו ידנית');
      return;
    }
    case 'loadCode': {
      const ta = $('#codeIn');
      decodeState(ta ? ta.value : '').then((st) => {
        closeSheet();
        mode = 'local'; G = st; lastViewer = -1; armed = null; opts = opts || { hide: true };
        saveLocal(); hideLobby(); render();
        toast('המשחק נטען');
      }).catch((e) => { sheetState.err = e && e.message ? e.message : 'קוד לא תקין'; const inv = ta ? ta.value : ''; drawSheet(); const n = $('#codeIn'); if (n) n.value = inv; });
      return;
    }
    /* פעולות משחק */
    case 'roll': act({ t: 'roll', d: [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)] }); return;
    case 'arm': {
      const k = d.k, C = E.COST[k];
      if (!E.canAfford(G.players[G.turn].res, C)) { toast('אין מספיק משאבים: ' + costIcons(C)); return; }
      const ids = k === 'road' ? E.legalRoads(G, G.turn) : k === 'house' ? E.legalHouses(G, G.turn) : E.legalCommunes(G, G.turn);
      if (!ids.length) { toast(k === 'commune' ? 'אין לך בית לשדרג' : 'אין מקום חוקי לבנייה'); return; }
      armed = k; render(); return;
    }
    case 'unarm': armed = null; selT = null; render(); return;
    case 'confirmSel': confirmSel(); return;
    case 'unsel': selT = null; Scene3D.setSelected(null); render(); return;
    case 'buyDev': act({ t: 'buy_dev' }); return;
    case 'endTurn': armed = null; act({ t: 'end_turn' }); return;
    case 'devs': if (viewer() < 0) { toast('אתם צופים במשחק'); return; } openSheet('devs', {}); return;
    case 'devBack': sheetState = {}; drawSheet(); return;
    case 'play': {
      const c = d.c;
      if (c === 'plenty') { sheetState = { pick: 'plenty', sel: [] }; drawSheet(); return; }
      if (c === 'monopoly') { sheetState = { pick: 'monopoly' }; drawSheet(); return; }
      closeSheet();
      act({ t: 'play_dev', card: c });
      return;
    }
    case 'plentyPick': {
      S.sel = (S.sel || []).concat([d.r]);
      if (S.sel.length >= 2) { const s = S.sel; closeSheet(); act({ t: 'play_dev', card: 'plenty', a: s[0], b: s[1] }); } else drawSheet();
      return;
    }
    case 'monoPick': closeSheet(); act({ t: 'play_dev', card: 'monopoly', res: d.r }); return;
    case 'victim': { const h = S.h; closeSheet(); act({ t: 'robber', h, victim: +d.p, r: Math.random() }); return; }
    case 'd+': S.sel = S.sel || {}; S.sel[d.r] = (S.sel[d.r] || 0) + 1; drawSheet(); return;
    case 'd-': S.sel = S.sel || {}; S.sel[d.r] = Math.max(0, (S.sel[d.r] || 0) - 1); drawSheet(); return;
    case 'dGo': { const p = S.p, sel = S.sel; closeSheet(); act({ t: 'discard', p, res: sel }); return; }
    /* סחר */
    case 'trade': openSheet('trade', { tab: 'bank', give: null, get: null, pg: {}, pw: {}, to: -1 }); return;
    case 'tab': S.tab = d.v; drawSheet(); return;
    case 'bGive': S.give = d.r; if (S.get === d.r) S.get = null; drawSheet(); return;
    case 'bGet': S.get = d.r; drawSheet(); return;
    case 'bGo': { const g = S.give, t = S.get; if (act({ t: 'bank_trade', give: g, get: t })) { S.give = null; S.get = null; drawSheet(); toast('הסחר בוצע'); } return; }
    case 'pg+': S.pg[d.r] = (S.pg[d.r] || 0) + 1; S.pw[d.r] = 0; drawSheet(); return;
    case 'pg-': S.pg[d.r] = Math.max(0, (S.pg[d.r] || 0) - 1); drawSheet(); return;
    case 'pw+': S.pw[d.r] = (S.pw[d.r] || 0) + 1; S.pg[d.r] = 0; drawSheet(); return;
    case 'pw-': S.pw[d.r] = Math.max(0, (S.pw[d.r] || 0) - 1); drawSheet(); return;
    case 'to': S.to = +d.i; drawSheet(); return;
    case 'offer': { const g = S.pg, w = S.pw, to = S.to; closeSheet(); if (act({ t: 'offer_trade', give: g, get: w, to })) toast('ההצעה נשלחה'); return; }
    case 'cancelTrade': act({ t: 'cancel_trade' }); return;
    case 'accept': { const p = S.p; closeSheet(); if (act({ t: 'respond_trade', p, accept: true })) toast('הסחר בוצע'); return; }
    case 'decline': { const p = S.p; closeSheet(); act({ t: 'respond_trade', p, accept: false }); return; }
  }
}
document.addEventListener('click', (e) => {
  if (e.target.id === 'sheetWrap' && sheetKind && sheetKind !== 'discard' && sheetKind !== 'trade_resp') { closeSheet(); return; }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  handle(t.dataset.act, t.dataset);
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.name !== undefined) lobbyS.names[+t.dataset.name] = t.value;
  if (t.id === 'chkHide') lobbyS.hide = t.checked;
  if (t.id === 'codeDigits') {
    const digits = t.value.replace(/\D/g, '').slice(0, 6);
    if (digits !== t.value) t.value = digits;
    joinDigits = digits; joinErr = '';
    const btn = document.querySelector('[data-act=onJoinGo]');
    if (btn) btn.disabled = digits.length !== 6;
  }
});
document.addEventListener('change', (e) => { if (e.target.id === 'chkHide') lobbyS.hide = e.target.checked; });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'chatIn') { e.preventDefault(); handle('sendChat', {}); }
  if (e.key === 'Enter' && e.target && e.target.id === 'codeDigits' && joinDigits.length === 6) { e.preventDefault(); handle('onJoinGo', {}); }
});

/* ---------- אתחול ---------- */
function boot() {
  try { Scene3D.init($('#gl')); } catch (e) {
    console.error(e);
    showOverlay('<div class="lobby"><h1>אופס</h1><p class="sub">לא הצלחתי להפעיל את הלוח בדפדפן הזה.</p></div>');
    return;
  }
  Scene3D.onTap = onBoardTap;
  const fr = document.querySelector('#fabs [data-act=rot]'), fc = document.querySelector('#fabs [data-act=costs]'), fm = document.querySelector('#fabs [data-act=menu]');
  if (fr) fr.innerHTML = I('rotate');
  if (fc) fc.innerHTML = I('list');
  if (fm) fm.innerHTML = I('menu');
  showLobby();
  initCaps();
}
window.__k = { act, tap: onBoardTap, state: () => G };
boot();
})();

</script>
